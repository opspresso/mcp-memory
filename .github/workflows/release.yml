name: Release (github + ecr + ghcr)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

# One build per tag.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_IMAGE: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-memory
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-memory

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: mcp_memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memory -d mcp_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://memory:memory@localhost:5432/mcp_memory_test

  # Notes come from the commit subjects between this tag and the previous one, so
  # the release page says what changed without anyone writing it twice. Scoped
  # `contents: write` here rather than at the top: only this job publishes.
  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow by default, and `git describe` needs the tags to find the
          # previous one.
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            notes="$(git log --no-merges --pretty='- %s' "${prev}..${tag}" | grep -v '^- chore: release' || true)"
          else
            notes="$(git log --no-merges --pretty='- %s' "${tag}" | grep -v '^- chore: release' || true)"
          fi
          gh release create "$tag" --title "$tag" --notes "$notes"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::396608815058:role/github--mcp-memory-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Attestations off: they turn a single-platform build into an image index
      # plus two untagged children, so every release costs three ECR entries
      # instead of one. Nothing here consumes the provenance.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_IMAGE }}:${{ github.ref_name }}
            ${{ env.ECR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Its own job, downstream of the image push: a deploy-trigger failure reads
  # as exactly that, and rerunning this job alone redeploys without a rebuild.
  # Tag pushes only — a manual dispatch run has no version a chart could pin.
  #
  # The token is the org-level GHP_TOKEN rather than the GitOps App's private
  # key: this repository is public, and the App key opens every repository the
  # App is installed on — more than a public repo should carry. (GITHUB_TOKEN
  # cannot be used either way: it is scoped to the repository running the
  # workflow, and this dispatch targets another one.)
  gitops:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `phase: alpha` is the deployed one (env/eks-demo.yaml names it), and
      # `container: app` is the top-level key in this chart's values file.
      - name: Trigger GitOps 🚀
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          gh api repos/opspresso/argocd-env-demo/dispatches \
            -f event_type=gitops \
            -f client_payload[username]=opspresso \
            -f client_payload[project]=mcp-memory \
            -f client_payload[version]="${GITHUB_REF_NAME}" \
            -f client_payload[container]=app \
            -f client_payload[phase]=alpha \
            -f client_payload[type]=helm
